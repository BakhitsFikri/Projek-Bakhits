<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk - Pengelolaan Barang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10231a;
    --muted: #5b6b62;
    --field: #eaf6ef;
    --plum: #166534;
    --btn: #14532d;
    --strip: #f3faf6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    min-height: 100vh;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background:
      radial-gradient(60% 50% at 0% 20%, #dff3e7 0%, rgba(223, 243, 231, 0) 70%),
      radial-gradient(50% 40% at 50% 0%, #f6fcf8 0%, rgba(246, 252, 248, 0) 70%),
      linear-gradient(135deg, #f2faf5 0%, #ebf7f0 50%, #e3f3ea 100%);
  }

  .card {
    width: 100%;
    max-width: 384px;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 24px 40px -12px rgba(16, 35, 26, 0.20),
      0 4px 10px rgba(16, 35, 26, 0.06);
  }

  .card-body { padding: 32px 38px 28px; }

  .head { text-align: center; }
  .head h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.2px;
    line-height: 1.25;
  }
  .head p {
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
  }

  form { margin-top: 28px; }

  .label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;
    padding: 0 14px;
    background: var(--field);
    border-radius: 8px;
    margin-bottom: 20px;
    transition: box-shadow 0.15s ease;
  }
  .field:focus-within { box-shadow: 0 0 0 2px rgba(22, 101, 52, 0.35); }

  .field .icon {
    width: 15px;
    height: 15px;
    flex: none;
    color: #6b7280;
  }

  .field input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
  }
  .field input::placeholder { color: #475569; opacity: 0.85; }
  .field input[type="password"] { letter-spacing: 2px; }
  .field input[type="password"]::placeholder { letter-spacing: normal; }

  .eye {
    flex: none;
    border: 0;
    background: none;
    cursor: pointer;
    color: #6b7280;
    display: flex;
    padding: 0;
  }
  .eye svg { width: 17px; height: 17px; }
  .eye:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; border-radius: 4px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -2px 0 22px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: #475569;
    cursor: pointer;
  }
  .remember input {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--plum);
    margin: 0;
    cursor: pointer;
    position: relative;
  }
  .remember input:not(:checked) {
    background: #fff;
    border: 1.5px solid #a3bba9;
  }
  .remember input:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 3px;
    height: 7px;
    border: solid #fff;
    border-width: 0 1.6px 1.6px 0;
    transform: rotate(45deg);
  }
  .remember input:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }

  .forgot {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
  }
  .forgot:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    height: 42px;
    border: 0;
    border-radius: 9px;
    background: var(--btn);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(20, 83, 45, 0.28);
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--plum); outline-offset: 3px; }
  .btn svg { width: 16px; height: 16px; }

  .strip { height: 44px; background: var(--strip); }

  .version {
    margin-top: 22px;
    font-size: 11px;
    color: #6b7280;
  }

  .error {
    display: none;
    margin: -8px 0 16px;
    font-size: 11.5px;
    color: #b42318;
  }
  .error.show { display: block; }

  @media (max-width: 420px) {
    .card-body { padding: 28px 24px 24px; }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="card-body">
      <header class="head">
        <h1>Selamat Datang di</h1>
        <p>Pengelolaan Barang</p>
      </header>

      <form id="loginForm" novalidate>
        <label class="label" for="username">Username</label>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 20c.6-3.6 3.6-5.5 7.5-5.5s6.9 1.9 7.5 5.5"/>
          </svg>
          <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
        </div>

        <label class="label" for="password">Kata Sandi</label>
        <div class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
            <circle cx="12" cy="16" r="1" fill="currentColor"/>
          </svg>
          <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
          <button type="button" class="eye" id="togglePw" aria-label="Tampilkan kata sandi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <p class="error" id="errorMsg" role="alert">Username dan kata sandi wajib diisi.</p>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" checked>
            Ingat saya
          </label>
          <a href="#" class="forgot">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn">
          Masuk
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </form>
    </div>
    <div class="strip"></div>
  </main>

  <p class="version">Versi 1.0</p>

<script>
  const pw = document.getElementById('password');
  const toggle = document.getElementById('togglePw');
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');

  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    if (!user || !pw.value) {
      errorMsg.classList.add('show');
      return;
    }
    errorMsg.classList.remove('show');
    // DEMO: belum ada pengecekan database. Sambungkan ke backend nanti.
    sessionStorage.setItem('fasilita_user', user);
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
